# ── Giới hạn RAM: phù hợp Oppo A5 2020 (3GB RAM, Termux dùng ~1.5GB) ──
org.gradle.jvmargs=-Xmx700m -Xms128m -XX:+UseSerialGC

# ── Tắt daemon: tránh process ngầm chiếm RAM ──────────────────────────
org.gradle.daemon=false

# ── Tắt parallel: A5 2020 chỉ có 8 nhân yếu, song song dễ OOM ────────
org.gradle.parallel=false

# ── Bật cache: lần sau build lại nhanh hơn, không tải lại thư viện ───
org.gradle.caching=true

# ── Tắt configure-on-demand: tránh lỗi lạ với Loom ───────────────────
# Thêm 3 dòng này vào cuối file gradle.properties
systemProp.http.connectionTimeout=60000
systemProp.http.socketTimeout=60000
org.gradle.internal.http.connectionTimeout=60000
